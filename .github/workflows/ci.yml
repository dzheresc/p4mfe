name: CI

on:
  push:
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  bench-smoke:
    # Builds every benchmark and runs the smoke tier, so benchmarks keep
    # compiling and their built-in correctness checks keep passing. Timings
    # from this job are not meaningful and are not compared.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset bench
      - name: Build
        run: cmake --build --preset bench -j
      - name: Run smoke tier
        env:
          P4MFE_BENCH_TIER: smoke
          BENCHMARK_MIN_TIME: 0.01s
        run: cmake --build --preset bench --target bench
      - uses: actions/upload-artifact@v4
        with:
          name: bench-smoke-json
          path: build/bench-release/bench/*.json

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "python[dev]"
      - name: Test
        run: pytest python
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatters
        run: pip install clang-format==18.1.3 "pyink==26.5.1"
      - name: C++ (clang-format, Google style)
        run: git ls-files 'cpp/*.hpp' 'cpp/*.cpp' | xargs clang-format --dry-run --Werror
      - name: Python (pyink, Google style)
        run: pyink --config python/pyproject.toml --check python tools

  naming:
    # Google naming: clang-tidy readability-identifier-naming (.clang-tidy)
    # for C++, pep8-naming via ruff ([tool.ruff.lint] in python/pyproject.toml)
    # for Python.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18
          pip install "ruff==0.16.9"
      - name: Compile database
        run: >
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DP4MFE_BUILD_BENCHMARKS=ON -DCMAKE_CXX_COMPILER=clang++-18
      - name: C++ (clang-tidy, Google naming)
        run: run-clang-tidy-18 -p build -quiet "$PWD/cpp/"
      - name: Python (ruff, pep8-naming)
        run: ruff check --config python/pyproject.toml python tools
